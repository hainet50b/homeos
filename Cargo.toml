[package]
name = "homeos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage install scripts in one place, reproducible on any machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hainet50b/homeos"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
