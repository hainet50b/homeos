[package]
name = "homeos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage install scripts in one place, reproducible on any machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hainet50b/homeos"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.5"
clap_complete_nushell = "4.6.0"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
